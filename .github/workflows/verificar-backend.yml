name: Verificar backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q backend
      - name: Verificar criação da aplicação
        working-directory: backend
        env:
          SECRET_KEY: teste-ci
          JWT_SECRET_KEY: teste-ci-jwt
          DATABASE_URL: sqlite:///beautysalon_ci.db
        run: python -c "from app import create_app; create_app()"
